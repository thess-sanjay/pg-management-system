# =========================================
# DATABASE CONFIGURATION
# =========================================

spring.datasource.url=jdbc:mysql://pg-management-system-pg-management-system.a.aivencloud.com:20567/defaultdb?useSSL=true&serverTimezone=UTC
spring.datasource.username=avnadmin
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# =========================================
# JWT CONFIGURATION
# =========================================

jwt.secret=${JWT_SECRET:PGMS_Local_JWT_Secret_Key_2026_Secure_384_Bits_Minimum}
jwt.expiration=86400000


# =========================================
# SERVER
# =========================================

server.port=${PORT:8080}
